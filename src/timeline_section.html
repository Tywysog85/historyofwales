<section id="timeline">
  <div class="wrap">
    <h2 class="vh" data-cy="Pob digwyddiad">All events</h2>
    <!-- Find first (November 2026): a box to jump to a year, person or event, then the ages as one row to swipe on phones (app.js, "Timeline: jump") -->
    <div class="tl-find">
      <form class="near-form tl-jump" id="tl-jump" role="search" autocomplete="off">
        <label for="tl-q" class="near-lbl" data-cy="Neidio i flwyddyn, person neu ddigwyddiad">Jump to a year, person or event</label>
        <input id="tl-q" type="search" enterkeyhint="go" aria-controls="tl-hits" aria-describedby="tl-msg" placeholder="e.g. 1282, Hywel, Tryweryn">
        <button type="submit" class="btn" data-cy="Mynd">Go</button>
      </form>
      <p class="near-msg" id="tl-msg" role="status"></p>
      <ol class="near-list tl-hits" id="tl-hits"></ol>
    </div>
    <div class="tl-tools">
      <div class="chips" id="tl-filter" role="group" aria-label="Filter by era"></div>
      <span class="people-count" id="tl-count"></span>
    </div>
    <div class="head">
      <p data-cy="Mae’r dotiau llawn yn nodi trobwyntiau. Mae gan bob digwyddiad ffynhonnell i chi ddarllen mwy.">Filled markers are turning points. Every event links to a source so you can read more. Switch to Cymraeg and the dates follow the Welsh convention: CC (Cyn Crist) and OC (Oed Crist).</p>
      __EVIKEY__
    </div>
    <div class="tl-grid">
      <div class="dial" id="dial">
        <div class="yr" id="dial-yr">230,000<small>BC</small></div>
        <div class="era-name" id="dial-era"></div>
        <p class="now" id="dial-now"></p>
        <div class="bar" id="dial-bar"></div>
      </div>
      <ol class="events" id="events"></ol>
    </div>
  </div>
</section>
