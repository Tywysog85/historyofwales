name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 4 * * *"   # rebuild every morning so the news feed carries the day's anniversaries
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to save src/added.json back (below)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow (for the share pictures)
        run: pip install pillow
      - name: Build site
        run: python3 build.py
        env:
          GOATCOUNTER: historyofwales
          SITE_URL: https://historyofwales.cymru/
          EMAIL_FORM: ${{ vars.EMAIL_FORM }}
      # The long reads read aloud live on the repository's "listen" release (made by .github/workflows/listen.yml,
      # see src/listen.py), not in the repository itself. Copy them into the site. Never stops the deploy.
      - name: Add the long reads read aloud
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view listen >/dev/null 2>&1; then
            mkdir -p _site/listen
            gh release download listen --pattern "*.m4a" --dir _site/listen --clobber
            echo "$(ls _site/listen | wc -l) sound files, $(du -sh _site/listen | cut -f1)"
          else
            echo "No listen release yet"
          fi
      # The build stamps anything new with the time it was added (src/added.json), so pages can show the newest first.
      # If a change forgot to commit that file, save it back here so the date stays put. Never stops the deploy.
      - name: Save when new items were added
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain -- src/added.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add src/added.json
            git commit -m "Record when new items were added to the site"
            git pull --rebase origin main && git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Tell Bing and other IndexNow search engines which pages changed today (see tools/indexnow.py).
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/indexnow.py
            src/seo.py
          sparse-checkout-cone-mode: false
      - name: Tell search engines about changed pages
        continue-on-error: true
        run: python3 tools/indexnow.py https://historyofwales.cymru/
