name: Look up pictures on Wikimedia Commons

# Picture research for Claude, whose cloud computer cannot reach Wikimedia (tools/commons_research.py).
# Reads tools/commons_research_in.json and commits the results (file list, licences and small previews) to the branch.
# It only does anything on the branch named in the file's "branch" field (or when started by hand from the Actions tab),
# so other branches that merge main never run someone else's look-up. It never fails the run, so nobody gets failure emails.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["tools/commons_research_in.json"]

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Is this look-up for this branch?
        id: mine
        run: |
          want=$(python3 -c "import json; print(json.load(open('tools/commons_research_in.json')).get('branch', ''))")
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || [ "$want" = "${GITHUB_REF_NAME}" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "Look-up is for '$want', not ${GITHUB_REF_NAME}: nothing to do."; fi
      - if: steps.mine.outputs.go == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.mine.outputs.go == '1'
        continue-on-error: true
        run: pip install pillow && python3 tools/commons_research.py
      - name: Commit the results
        if: steps.mine.outputs.go == '1'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f _research
          git diff --cached --quiet && exit 0
          git commit -m "Picture research results (tools/commons_research.py)"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep 5; done
          echo "Could not push the results; start the look-up again from the Actions tab."
