name: Fetch photos from Wikimedia Commons

# Downloads the Commons photos the site still loads from Wikimedia and commits small WebP copies to the branch
# (tools/fetch_photos.py). Start it from the Actions tab, or it runs by itself when the script changes on a claude/ branch.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["tools/fetch_photos.py", "tools/fetch_legend_photos.py", ".github/workflows/fetch-photos.yml"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Build, then fetch the photos it still loads from Commons
        run: python3 build.py && python3 tools/fetch_photos.py
      - name: Fetch the legend photographs
        run: python3 tools/fetch_legend_photos.py
      - name: Commit the photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/static/photos src/photo_files.json src/static/legends
          git diff --cached --quiet || git commit -m "Keep the Commons photos on the site (tools/fetch_photos.py)"
          git push
