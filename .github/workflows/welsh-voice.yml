name: Welsh voices for the play buttons

# Gives every Welsh play button a proper Welsh sound: first real speakers from Lingua Libre (tools/fetch_audio.py), then,
# for anything still missing, Bangor University's Welsh voice via Piper, checked by a Welsh speech recogniser
# (tools/make_voice.py). Commits the MP3s, src/audio_credits.json and the check report (_research/voice).
# Claude's cloud computer cannot reach Wikimedia or Hugging Face, so this runs here. It only does anything on the branch
# named in tools/voice_request.json (or when started by hand from the Actions tab), so other branches never repeat it.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["tools/voice_request.json"]

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Is this for this branch?
        id: mine
        run: |
          want=$(python3 -c "import json; print(json.load(open('tools/voice_request.json')).get('branch', ''))")
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || [ "$want" = "${GITHUB_REF_NAME}" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "Request is for '$want', not ${GITHUB_REF_NAME}: nothing to do."; fi
      - if: steps.mine.outputs.go == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.mine.outputs.go == '1'
        name: Install ffmpeg, Piper and the speech recogniser
        run: |
          sudo apt-get install -y ffmpeg
          pip install piper-tts
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers
      - if: steps.mine.outputs.go == '1'
        name: Build, then real recordings, then the Welsh voice for the rest
        run: |
          CARDS=0 python3 build.py
          python3 tools/fetch_audio.py
          redo=$(python3 -c "import json; print('--redo' if json.load(open('tools/voice_request.json')).get('redo') else '')")
          python3 tools/make_voice.py $redo
      - name: Commit the sounds
        if: always() && steps.mine.outputs.go == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/static/audio src/audio_credits.json
          git add -f _research/voice 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Welsh voices for the play buttons (tools/fetch_audio.py, tools/make_voice.py)"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep 5; done
          exit 1
