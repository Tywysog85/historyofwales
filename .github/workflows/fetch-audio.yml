name: Fetch Welsh recordings from Lingua Libre

# Downloads free recordings of the site's Welsh words and phrases from Lingua Libre (Wikimedia Commons), keeps them as
# small MP3s in src/static/audio and credits them in src/audio_credits.json (tools/fetch_audio.py). Start it from the
# Actions tab, or it runs by itself when the script changes on a claude/ branch.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["tools/fetch_audio.py", ".github/workflows/fetch-audio.yml"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y ffmpeg
      - name: Build, then fetch the recordings
        run: CARDS=0 python3 build.py && python3 tools/fetch_audio.py
      - name: Commit the recordings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/static/audio src/audio_credits.json
          git diff --cached --quiet || git commit -m "Real Welsh voices from Lingua Libre (tools/fetch_audio.py)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
